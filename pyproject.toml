[project]
name = "crm-mcp-server"
version = "0.2.0"
description = "A small MCP server that lets AI agents read and update CRM leads safely."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Liyona Johny" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2,<3",
    "pydantic>=2.7",
]

[project.scripts]
crm-mcp-server = "crm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
